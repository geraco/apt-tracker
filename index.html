<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          background: #f1f5f9; display: flex; align-items: center;
          justify-content: center; min-height: 100vh; }
  .card { background: white; border-radius: 14px; padding: 40px 44px;
           box-shadow: 0 4px 24px rgba(0,0,0,.10); width: 100%; max-width: 380px;
           text-align: center; }
  h1 { font-size: 20px; font-weight: 700; color: #1e3a5f; }
  .sub { color: #64748b; font-size: 14px; margin-top: 4px; margin-bottom: 28px; }
  input[type=password] {
    width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1;
    border-radius: 8px; font-size: 15px; outline: none;
    transition: border-color .15s;
  }
  input[type=password]:focus { border-color: #3b82f6; }
  button {
    margin-top: 14px; width: 100%; padding: 11px; background: #1e3a5f;
    color: white; border: none; border-radius: 8px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: background .15s;
  }
  button:hover { background: #2d5a8e; }
  button:disabled { background: #94a3b8; cursor: default; }
  .error { color: #dc2626; font-size: 13px; margin-top: 12px; min-height: 18px; }
  .spinner { display: none; margin-top: 12px; color: #64748b; font-size: 13px; }
</style>

function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function unlock() {
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  document.getElementById('err').textContent  = '';
  document.getElementById('btn').disabled     = true;
  document.getElementById('spin').style.display = 'block';
  try {
    const km  = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
                  'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(SALT), iterations:100000, hash:'SHA-256' },
      km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const dec = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(IV) }, key, b64(CT));
    const html = new TextDecoder().decode(dec);
    document.open(); document.write(html); document.close();
  } catch(e) {
    document.getElementById('err').textContent  = 'Incorrect password — try again.';
    document.getElementById('btn').disabled     = false;
    document.getElementById('spin').style.display = 'none';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}

document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock();
});
</script>
